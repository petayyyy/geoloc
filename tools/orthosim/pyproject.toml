[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoloc-orthosim"
version = "0.1.0"
description = "T10/T11 OrthoSim: synthetic true-ortho query / map-window pair generator with exact ground truth"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "rasterio>=1.3",
    "pyproj>=3.4",
    "PyYAML>=6",
    "Pillow>=9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
orthosim = "orthosim.cli:main"

[tool.setuptools.packages.find]
include = ["orthosim*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]
