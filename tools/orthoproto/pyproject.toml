[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoloc-orthoproto"
version = "0.1.0"
description = "T14+T15 offline prototype: FAST-LIVO2 camera_init -> UTM37N via RTK anchor, lidar DSM, true-ortho patches"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "rosbags>=0.9.23",
    "rasterio>=1.3",
    "pyproj>=3.4",
    "PyYAML>=6",
    "Pillow>=9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
orthoproto = "orthoproto.cli:main"

[tool.setuptools.packages.find]
include = ["orthoproto*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]
