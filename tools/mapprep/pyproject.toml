[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoloc-mapprep"
version = "0.1.0"
description = "T05: basemap downloader and COG mosaic builder for geoloc geopacks"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "rasterio>=1.3",
    "pyproj>=3.4",
    "PyYAML>=6",
    "jsonschema>=4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mapprep = "mapprep.cli:main"

[tool.setuptools.packages.find]
include = ["mapprep*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]
