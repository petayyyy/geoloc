# Offline true-ortho prototype config for geoloc_capture_01
# (MARS-LVIG AMtown03, replayed through the FAST-LIVO2 port).
#
# SITE: the Ararat plain, ARMENIA -- 39.92 N / 44.83 E, UTM zone 38N, terrain
# ~1050 m above the ellipsoid. This capture was NOT flown near Maykop; see
# configs/mapprep/amtown_armenia.yaml and tools/orthoproto/README.md for how
# that was established (2026-08-27).
#
# Data quirks of this capture, recorded here because they are config, not code:
#   - rtk.swap_latlon: FALSE. The DJI NavSatFix fields are correctly labelled.
#     Reading them swapped stretches northing x1.300 and squeezes easting
#     x0.712, which is what the old "odometry under-measures by 22%" story
#     really was. `orthoproto check` guards this;
#   - rtk.velocity_frame: /dji_osdk_ros/rtk_velocity is NED (x=North, y=East),
#     measured against the position derivative (slope 1.003/1.001, r=0.9998);
#   - rtk altitude is FINE (1155.45-1155.72 m ellipsoidal over the whole
#     capture -- that is level flight at 80 m AGL, not a frozen field;
#     /dji_osdk_ros/gps_position reports the same track 26.8 m lower, i.e.
#     orthometric). dsm.z_datum=dem is still the safer datum because a single
#     constant altitude carries no vertical shape;
#   - camera: FAST-LIVO2 config camera_MARS_LVIG_AM.yaml, scale 0.25 -> the
#     /rgb_img VIO size; images are raw (undistorted only in the math);
#   - ortho.img_time_offset_s: VIO image time offset from the same config.

bag_dir: "data/captures/geoloc_capture_01"
# NOTE: this geopack does not exist yet -- it must be built once with network:
#   python -m mapprep build --config configs/mapprep/amtown_armenia.yaml #       --out data/missions/amtown-armenia-2026-08.geopack
# The old maykop-corridor-2026-08.geopack covers a different place ~430 km
# away and must not be used with this capture.
geopack_dir: "data/missions/amtown-armenia-2026-08.geopack"
out_dir: "data/outputs/geoloc_capture_01_ortho"
crs: "EPSG:32638"

rtk:
  swap_latlon: false
  velocity_frame: ned
  # `orthoproto check` tolerance on the projected-position / Doppler-integral
  # distance ratio. The capture measures 0.9995 with the fields read straight
  # and 1.2277 with them swapped, so anything past a couple of percent is a
  # georeference bug, not noise.
  doppler_baseline_s: 3.0
  doppler_ratio_tol: 0.02

align: # T14/T15 step 1: camera_init -> UTM37N via RTK anchor
  # method: "pose_graph" (global pose-graph + leveling, default) or
  # "windowed" (legacy independent windowed Kabsch fits, kept for comparison).
  method: pose_graph
  # No global scale: with the RTK fixes read correctly the FAST-LIVO2 odometry
  # is metrically right (windowed rigid fit onto the RTK track: 0.04 m RMS over
  # 5 s, 0.17 m over 20 s, 1.0 m over the whole 51 s capture; fitted scale
  # 0.9990-1.0000). The 1.2261 this used to estimate was absorbing the lat/lon
  # swap. A free scale here would hide the next georeference bug the same way.
  estimate_scale: false
  # -- pose_graph params --
  step_s: 2.0          # inter-keyframe node spacing, seconds
  rtk_weight: 1.0      # absolute RTK-constraint weight (E/N only)
  smooth_weight: 0.5   # heading-smoothness prior weight
  rtk_huber_m: 2.0     # Huber robust-loss threshold on RTK residual, metres
  max_iter: 200
  # -- windowed (legacy) params --
  window_s: 12.0
  window_step_s: 4.0
  min_pairs: 8

camera: # camera_MARS_LVIG_AM.yaml @ scale 0.25 (the VIO working size)
  # /rgb_img is FAST-LIVO2's DEBUG visualization -- the VIO image with its
  # projected lidar points drawn on top in green and blue. Those dots are
  # burnt into the pixels, so every patch built from it carries synthetic
  # marks the satellite basemap cannot contain, in the very image the matcher
  # compares against the world. /left_camera/image is the raw sensor frame:
  # clean, full 2448x2048, and stamped with the capture time rather than the
  # fused-frame time FAST-LIVO2 restamps its output with. It is downscaled by
  # `scale` at read time, so the working resolution and the intrinsics below
  # are unchanged -- only the pixels get cleaner.
  image_topic: /left_camera/image
  width: 2448
  height: 2048
  scale: 0.25
  fx: 1453.88
  fy: 1452.85
  cx: 1182.53
  cy: 1045.82
  d0: -0.052
  d1: 0.1168
  d2: 0.0015
  d3: 0.00013
  # Rcl (extrin_calib in MARS_LVIG_AMtown.yaml): fixed rotation from the
  # lidar/IMU body frame (what odometry orientation is expressed in) to the
  # camera's own optical frame. Far from identity on this rig -- omitting it
  # pointed every rendered ray bundle in the wrong direction (see
  # run_ortho's R_lidar_to_cam docstring).
  Rcl:
    - [-0.0022464, -0.9997299, -0.0231319]
    - [-0.0084211,  0.0231501, -0.9996966]
    - [ 0.9999620, -0.0020509, -0.0084708]

dsm: # T14
  dsm_gsd_m: 0.5
  margin_m: 150.0
  range_max_m: 190.0
  median_win: 5
  outlier_threshold_m: 3.0
  dense_min_points: 4
  sparse_min_points: 1
  z_datum: dem # "dem" (recommended for this capture) or "rtk"

ortho: # T15
  patch_gsd_m: 0.5
  patch_radius_m: 130.0
  ray_steps: 48
  agl_floor_m: 30.0
  # Real flight AGL is ~80 m (AMtown.kml <mis:altitude>, relativeToGround).
  # `camera_init` is not gravity-aligned on this rig (its z axis is ~88 deg off
  # vertical), so the leveling step is what turns odometry z into altitude at
  # all; after it, the track's true vertical extent over the capture is 0.63 m.
  # Keep the ceiling as a safety net against a bad pose.
  agl_max_m: 100.0
  # Camera pixels backing one ortho pixel, below which confidence is scaled
  # down proportionally. The base confidence only says which terrain source a
  # height came from (lidar vs DEM), so without this a ray grazing the ground
  # -- the "comet" smear in the patch periphery -- reports the same
  # confidence as a near-nadir one, and the matcher has no way to gate on it.
  # 0 disables the term (previous behaviour). 1.0 = "demand at least one
  # camera pixel of real information per ortho pixel".
  min_sample_density: 1.0
  patch_every_n: 40
  aa_blur_passes: 2
  # 0.0 for the raw camera topic: its header stamp IS the capture time, per
  # the project rule that timestamps are sensor-capture time. The former
  # -0.1 s existed only to undo FAST-LIVO2's restamping of /rgb_img, whose
  # stamps do not pair with the camera's at all (best constant shift leaves
  # 41 ms residual with 102 ms scatter -- there is no clean offset to find).
  img_time_offset_s: 0.0
