# Offline true-ortho prototype config for geoloc_capture_01
# (Maykop corridor, MARS-LVIG rig replayed through the FAST-LIVO2 port).
#
# Data quirks of this capture, recorded here because they are config, not code:
#   - rtk.swap_latlon: the DJI RTK topic stores lat/lon in swapped fields;
#   - rtk altitude is unreliable (frozen at ~1155.6 m); dsm.z_datum=dem shifts
#     the DSM onto the geopack DEM ellipsoid instead;
#   - camera: FAST-LIVO2 config camera_MARS_LVIG_AM.yaml, scale 0.25 -> the
#     /rgb_img VIO size; images are raw (undistorted only in the math);
#   - ortho.img_time_offset_s: VIO image time offset from the same config.

bag_dir: "data/captures/geoloc_capture_01"
geopack_dir: "data/missions/maykop-corridor-2026-08.geopack"
out_dir: "data/outputs/geoloc_capture_01_ortho"
crs: "EPSG:32637"

rtk:
  swap_latlon: true

align: # T14/T15 step 1: camera_init -> UTM37N via RTK anchor
  # method: "pose_graph" (global pose-graph + leveling + scale, default) or
  # "windowed" (legacy independent windowed Kabsch fits, kept for comparison).
  # The replayed FAST-LIVO2 odometry under-measures distance by ~22%; the
  # pose-graph estimates that scale (1.227 for this capture) which the rigid
  # windowed fit cannot (see tools/orthoproto/README.md "Known open items").
  method: pose_graph
  # -- pose_graph params --
  step_s: 2.0          # inter-keyframe node spacing, seconds
  rtk_weight: 1.0      # absolute RTK-constraint weight (E/N only)
  smooth_weight: 0.5   # heading-smoothness prior weight
  rtk_huber_m: 2.0     # Huber robust-loss threshold on RTK residual, metres
  max_iter: 200
  # -- windowed (legacy) params --
  window_s: 12.0
  window_step_s: 4.0
  min_pairs: 8

camera: # camera_MARS_LVIG_AM.yaml @ scale 0.25 (the /rgb_img VIO image size)
  width: 2448
  height: 2048
  scale: 0.25
  fx: 1453.88
  fy: 1452.85
  cx: 1182.53
  cy: 1045.82
  d0: -0.052
  d1: 0.1168
  d2: 0.0015
  d3: 0.00013
  # Rcl (extrin_calib in MARS_LVIG_AMtown.yaml): fixed rotation from the
  # lidar/IMU body frame (what odometry orientation is expressed in) to the
  # camera's own optical frame. Far from identity on this rig -- omitting it
  # pointed every rendered ray bundle in the wrong direction (see
  # run_ortho's R_lidar_to_cam docstring).
  Rcl:
    - [-0.0022464, -0.9997299, -0.0231319]
    - [-0.0084211,  0.0231501, -0.9996966]
    - [ 0.9999620, -0.0020509, -0.0084708]

dsm: # T14
  dsm_gsd_m: 0.5
  margin_m: 150.0
  range_max_m: 190.0
  median_win: 5
  outlier_threshold_m: 3.0
  dense_min_points: 4
  sparse_min_points: 1
  z_datum: dem # "dem" (recommended for this capture) or "rtk"

ortho: # T15
  patch_gsd_m: 0.5
  patch_radius_m: 130.0
  ray_steps: 48
  agl_floor_m: 30.0
  # Real flight AGL is ~80 m (AMtown.kml). The pose-graph alignment's
  # leveling fixes the FAST-LIVO2 Z drift through the 180-degree turn, so
  # computed AGL now stays ~63-97 m (0 frames exceed this ceiling). Keep the
  # ceiling as a safety net against any remaining bad pose.
  agl_max_m: 100.0
  patch_every_n: 40
  aa_blur_passes: 2
  img_time_offset_s: -0.1
