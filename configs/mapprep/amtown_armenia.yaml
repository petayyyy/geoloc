# T05 build config: AMtown site (MARS-LVIG AMtown03 / AMtown.kml waypoints).
#
# Every number here is CONFIGURATION, not a code constant (P0-common.md rule 6).
# Licensing note (ADR-008 open): Esri / Bing / Yandex imagery is used for
# internal development only. The manifest records the terms and claims no
# commercial-use rights until ADR-008 is closed.
#
# SITE PROVENANCE (established 2026-08-27, full evidence in
# tools/orthoproto/README.md): this is NOT the Maykop corridor. The
# AMtown03 capture was flown on 2022-07-18 over a village on the Ararat plain,
# ARMENIA, at 39.92 N / 44.83 E -- ~430 km from Maykop and ~900 m higher.
# Evidence: AMtown.kml read per the KML spec (lon,lat,alt); the DJI NavSatFix
# fields as labelled; a metric self-consistency check of the RTK track against
# its own Doppler velocity; and a direct NCC match of a raw /rgb_img frame
# against Esri World Imagery, which lands 16 m from the RTK-predicted position.

mission_id: "amtown-armenia-2026-08"

crs: "EPSG:32638"            # UTM zone 38N -- lon 44.83 is zone 38, not 37

# Corridor: AMtown.kml mission extent (lon 44.8230-44.8335, lat 39.9194-39.9249)
# plus ~150 m of margin for the ortho patch radius.
bounds:
  west: 44.8215
  south: 39.9180
  east: 44.8355
  north: 39.9265

# ENU anchor (mission parameter, never a code constant)
origin:
  lat: 39.9222
  lon: 44.8285
  alt: 80.0

layers:
  # Provider assignment is site-specific, not a house default. Over this
  # village Esri World Imagery has nothing finer than z18 (0.46 m/px) and
  # answers z19 with "Map data not yet available" cards; Bing has real z19
  # (0.23 m/px). So Bing is the 0.3 m primary here and Esri the 0.5 m
  # secondary, which is the only assignment where both layers hit their
  # target GSD with actual imagery.
  #
  # max_zoom stays at the provider ceiling on purpose: `select_zoom` probes
  # and steps down when a zoom turns out to be placeholder cards, which is
  # more robust than a hand-tuned number that goes stale when a provider
  # publishes new imagery.
  #
  # Primary: 0.3 m/px -- flight AGL is 80 m (AMtown.kml <mis:altitude>).
  - name: ortho_a
    provider: bing_aerial
    target_gsd_m: 0.3
    max_zoom: 19
    min_zoom: 17
  # Secondary: 0.5 m/px, second provider -- cross-provider matching is a hard
  # project invariant, the query patch and the reference must never share a
  # provider.
  - name: ortho_b
    provider: esri_world_imagery
    target_gsd_m: 0.5
    max_zoom: 19
    min_zoom: 17

cache:
  root: "~/.cache/geoloc/tiles"

mosaic:
  overviews: [2, 4, 8]       # coarse level ~4 m/px for cold start / LOST search
  jpeg_quality: 85
  seam_px: 2
  # A tile server answering 200 is not the same as it having imagery. A tile
  # counts as a provider placeholder when it is BOTH textureless (greyscale
  # std below placeholder_std -- Esri's card measures ~5, real imagery here
  # ~55) AND byte-identical to at least placeholder_min_repeats others in the
  # layer. Such tiles are excluded from the mosaic and marked invalid, and a
  # layer over placeholder_max_frac of them fails the build rather than
  # shipping a reference basemap that reports validity it does not have.
  # Set placeholder_std to 0 to disable the check entirely.
  placeholder_std: 8.0
  placeholder_min_repeats: 4
  placeholder_max_frac: 0.2

# Copernicus GLO-30 DEM (T06): filler where the Livox FOV does not cover the
# camera frame. The terrain here sits ~1050 m above the ellipsoid (the RTK
# reports 1155.6 m at 80 m AGL); the Maykop geopack's DEM reads 143-159 m,
# which is one of the ways the wrong-site geopack was caught.
dem:
  # Copernicus GLO-30's PUBLIC S3 release excludes several countries, Armenia
  # among them: for N39 the open 30 m bucket stops at E043 and this corridor
  # needs E044. OpenTopography redistributes the same GLO-30 data with full
  # coverage under its own agreement, behind a free API key -- 30.9 m native
  # here, 1027-1269 m over this bbox.
  #
  # The key is read from the environment, never stored in the repo or the
  # geopack. Before building:
  #     export OPENTOPOGRAPHY_API_KEY=<your key from portal.opentopography.org>
  # (PowerShell: $env:OPENTOPOGRAPHY_API_KEY = "<key>")
  # A missing key fails the build loudly rather than quietly coarsening it.
  source: opentopography_cop30
  api_key_env: OPENTOPOGRAPHY_API_KEY
  bbox_margin_deg: 0.01
  # Keyless 90 m escape hatch, used only if OpenTopography reports no coverage
  # for this bbox (never on a rejected key or a network error). Whichever
  # product actually supplies the data is named in the manifest along with the
  # measured native_gsd.
  fallback_sources: [copernicus_glo90]
  target_gsd_m: 10
  geoid_model: egm2008       # EGM2008 grid from the PROJ CDN, cached on disk
  cache_dir: "~/.cache/geoloc/dem"
  geoid_cache_dir: "~/.cache/geoloc/geoid"

# OSM semantic raster (T06): reference layer for fallback channel 2 (T20) and
# the terrain classifier that all metrics are broken down by.
semantic:
  source: osm
  gsd: 1.0
  road_half_width_m: 3.0
  water_line_half_width_m: 2.0
  # Public Overpass instances answer 504 when their query slots are busy --
  # a load signal, not a query error. Endpoints rotate per attempt and the
  # backoff is linear (attempt x backoff_s). Raise these if the build keeps
  # dying here; the corridor query itself answers in ~2 s on a free slot.
  overpass_attempts: 4
  overpass_backoff_s: 5.0
  overpass_timeout_s: 90.0

# Best-effort per-tile capture dates via the Esri World Imagery metadata
# service. When unavailable the manifest records capture_date: null honestly.
enrich_capture_dates: true
